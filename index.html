<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Morning Roji!</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000000; /* Pure Black Background */
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    /* Animated Glowing Lightning Icon */
    .lightning-icon {
      font-size: 3.5rem;
      margin-bottom: 15px;
      animation: lightningGlow 1s infinite alternate ease-in-out;
    }

    @keyframes lightningGlow {
      0% {
        transform: scale(1);
        text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700, 0 0 30px #ffae00;
        filter: drop-shadow(0 0 5px #fff);
      }
      100% {
        transform: scale(1.2);
        text-shadow: 0 0 20px #ffd700, 0 0 40px #ffae00, 0 0 60px #ff8c00;
        filter: drop-shadow(0 0 15px #ffd700);
      }
    }

    .container {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 8px 32px 0 rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 400px;
      width: 100%;
      margin-bottom: 25px;
      animation: fadeIn 1.5s ease-in-out;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      color: #ffb6c1;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    span {
      font-weight: bold;
      color: #ffe4e1;
    }

    .tap-notice {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #ffb6c1;
      opacity: 0.8;
      animation: pulse 1.5s infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body onclick="startAudioAndConfetti()">

  <!-- Glowing Lightning Bolt Header -->
  <div class="lightning-icon">⚡</div>

  <div class="container">
    <h1>Good Morning Roji! 🌸</h1>
    <p>
      Have a good day ahead. <br>
      <span>Be strong, take care, pretty girl!</span> ✨
    </p>
    <div class="tap-notice">✨ Tap anywhere on screen for music & flowers ✨</div>
  </div>

  <!-- Audio configured to loop continuously -->
  <audio id="myAudio" src="22b070edf7e4937e5d7ba203fb494249.mp3" loop preload="auto"></audio>

  <script>
    let hasStarted = false;

    // Trigger flowers on initial load
    window.addEventListener('load', () => {
      triggerConfetti();
    });

    function triggerConfetti() {
      confetti({
        particleCount: 100,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    function startAudioAndConfetti() {
      var audio = document.getElementById("myAudio");

      // Auto-play song on first tap/click and loop forever
      if (audio.paused) {
        audio.play().catch(function(error) {
          console.log("Autoplay waiting for touch:", error);
        });
      }

      // Pop flowers on screen tap
      if (!hasStarted) {
        triggerConfetti();
        hasStarted = true;
      }
    }
  </script>

</body>
</html>
