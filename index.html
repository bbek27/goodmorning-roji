<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Morning Roji!</title>
  <!-- Canvas Confetti Library for the burst effect -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0d0f23, #2a0845, #16002c);
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    /* Floating Flowers Container */
    .flower-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .flower {
      position: absolute;
      bottom: -50px;
      font-size: 24px;
      animation: floatUp 8s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Glassmorphism Card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 40px 25px;
      max-width: 500px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      animation: fadeIn 1.5s ease-out;
    }

    /* Lightning Glow Text Effect */
    .glowing-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-shadow: 
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #ff007f,
        0 0 30px #ff007f,
        0 0 40px #ff007f;
      animation: lightningGlow 1.5s ease-in-out infinite alternate;
    }

    @keyframes lightningGlow {
      0% {
        text-shadow: 
          0 0 4px #fff,
          0 0 10px #e0aaff,
          0 0 18px #c77dff,
          0 0 30px #7b2cbf;
      }
      100% {
        text-shadow: 
          0 0 8px #fff,
          0 0 15px #ff9eaf,
          0 0 25px #ff007f,
          0 0 40px #ff007f,
          0 0 60px #ff007f;
      }
    }

    .message {
      font-size: 1.25rem;
      line-height: 1.8;
      color: #f1f1f1;
      font-weight: 400;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .highlight {
      color: #ff9eaf;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Floating Flowers Layer -->
  <div class="flower-container" id="flowerContainer"></div>

  <!-- Main Card -->
  <div class="card">
    <h1 class="glowing-title">Good Morning Roji! 🌸</h1>
    <p class="message">
      Have a good day ahead. <br>
      <span class="highlight">Be strong, take care, pretty girl!</span> ✨
    </p>
  </div>

  <script>
    // 1. Birthday Burst Effect (Confetti) on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      // First big burst
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });

      // Side fireworks burst
      setTimeout(() => {
        confetti({
          particleCount: 60,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        });
        confetti({
          particleCount: 60,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        });
      }, 400);
    });

    // 2. Generate Floating Flowers
    const flowerContainer = document.getElementById('flowerContainer');
    const flowers = ['🌸', '🌺', '🌷', '🌼', '✨', '💖'];

    function createFlower() {
      const flower = document.createElement('div');
      flower.classList.add('flower');
      flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
      flower.style.left = Math.random() * 100 + 'vw';
      flower.style.animationDuration = Math.random() * 3 + 6 + 's'; // between 6-9s
      flower.style.fontSize = Math.random() * 15 + 20 + 'px'; // between 20-35px
      
      flowerContainer.appendChild(flower);

      setTimeout(() => {
        flower.remove();
      }, 9000);
    }

    // Create a new flower every 400ms
    setInterval(createFlower, 400);
  </script>

</body>
</html>
