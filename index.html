<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Morning Roji</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding-top: 50px;
      overflow: hidden; /* Prevents scrollbars as emojis bounce */
      height: 100vh;
    }

    /* Style for floating bouncing elements */
    .bouncing-emoji {
      position: absolute;
      font-size: 3rem;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <h1>Good Morning, Roji!</h1>

  <!-- Floating Emojis -->
  <div class="bouncing-emoji" id="emoji1">🥰</div>
  <div class="bouncing-emoji" id="emoji2">💖</div>

  <script>
    function makeBounce(elementId, speedX, speedY) {
      const el = document.getElementById(elementId);
      
      // Starting positions
      let posX = Math.random() * (window.innerWidth - 60);
      let posY = Math.random() * (window.innerHeight - 60);
      
      let dx = speedX;
      let dy = speedY;

      function update() {
        const width = window.innerWidth - 60;
        const height = window.innerHeight - 60;

        posX += dx;
        posY += dy;

        // Bounce off left/right edges
        if (posX <= 0 || posX >= width) {
          dx = -dx;
        }

        // Bounce off top/bottom edges
        if (posY <= 0 || posY >= height) {
          dy = -dy;
        }

        el.style.left = posX + 'px';
        el.style.top = posY + 'px';

        // Keeps bouncing endlessly frame by frame
        requestAnimationFrame(update);
      }

      update();
    }

    // Start bouncing both emojis (adjust numbers for different speeds)
    makeBounce('emoji1', 3, 2);
    makeBounce('emoji2', -2.5, 3.5);
  </script>

</body>
</html>
