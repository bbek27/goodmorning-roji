 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Morning Roji ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Start Overlay to allow audio play */
    .start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .start-btn {
      padding: 15px 30px;
      font-size: 1.5rem;
      background: linear-gradient(45deg, #ff3399, #ff99cc);
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 0 20px #ff3399;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.05); }
      100% { transform: scale(0.95); }
    }

    /* Opening Flower Overlay */
    .flower-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      font-size: 5rem;
      pointer-events: none;
      z-index: 10;
    }

    .flower-overlay.active {
      display: flex;
      animation: fadeOutFlowers 3s forwards;
      animation-delay: 2s;
    }

    .flower {
      animation: popIn 1.5s ease-out forwards;
      opacity: 0;
      transform: scale(0.2);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.2); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeOutFlowers {
      0% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* Main Greeting Message */
    .greeting-container {
      z-index: 5;
      text-align: center;
      padding: 25px;
      max-width: 90%;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
      border: 1px solid rgba(255, 192, 203, 0.3);
      backdrop-filter: blur(5px);
    }

    .greeting-text {
      font-size: 2.2rem;
      font-weight: bold;
      color: #ff99cc;
      text-shadow: 0 0 12px #ff3399, 0 0 25px #ff66b2;
      line-height: 1.5;
    }

    .audio-player {
      margin-top: 25px;
      z-index: 5;
    }

    /* Floating/Bouncing 50 Emojis */
    .emoji-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }

    .floating-emoji {
      position: absolute;
      font-size: 2rem;
      user-select: none;
      animation: bounceFloat 6s ease-in-out infinite alternate;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    @keyframes bounceFloat {
      0% {
        transform: translateY(100vh) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      50% {
        transform: translateY(40vh) scale(1.2) rotate(180deg);
      }
      100% {
        transform: translateY(-10vh) scale(0.9) rotate(360deg);
        opacity: 0.8;
      }
    }
  </style>
</head>
<body>

  <!-- Tap overlay so browsers unlock audio -->
  <div class="start-overlay" id="startOverlay">
    <button class="start-btn">Tap to Open ✨</button>
  </div>

  <!-- 1. Opening Flower Overlay -->
  <div class="flower-overlay" id="flowerOverlay">
    <span class="flower">🌸</span>
    <span class="flower" style="animation-delay: 0.3s;">🌺</span>
    <span class="flower" style="animation-delay: 0.6s;">🌹</span>
    <span class="flower" style="animation-delay: 0.9s;">🌻</span>
    <span class="flower" style="animation-delay: 1.2s;">💐</span>
  </div>

  <!-- 2. Main Message Container -->
  <div class="greeting-container">
    <h1 class="greeting-text">
      good morning Roji ✨️<br>
      have a good day ahead<br>
      god bless you preety girl ..
    </h1>

    <!-- 3. Pre-loaded Song -->
    <div class="audio-player">
      <audio id="bgSong" loop controls>
        <source src="https://cdns-preview-d.dzcdn.net/stream/c-d102e3b5e40efbf27e04df86646ce6d3-2.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>
    </div>
  </div>

  <!-- 4. Container for 50 Floating Emojis -->
  <div class="emoji-container" id="emojiContainer"></div>

  <script>
    const startOverlay = document.getElementById('startOverlay');
    const flowerOverlay = document.getElementById('flowerOverlay');
    const audio = document.getElementById('bgSong');

    startOverlay.addEventListener('click', () => {
      // 1. Hide tap screen
      startOverlay.style.display = 'none';

      // 2. Play audio
      audio.play();

      // 3. Show flower animation
      flowerOverlay.classList.add('active');

      // 4. Generate 50 Floating/Bouncing Emojis
      const emojiList = ['🥰', '💖', '✨', '💕', '🌸', '💐', '❤️', '💗'];
      const container = document.getElementById('emojiContainer');
      const totalEmojis = 50;

      setTimeout(() => {
        for (let i = 0; i < totalEmojis; i++) {
          const span = document.createElement('span');
          span.classList.add('floating-emoji');
          span.innerText = emojiList[Math.floor(Math.random() * emojiList.length)];
          span.style.left = Math.random() * 95 + 'vw';
          
          const duration = 4 + Math.random() * 5;
          span.style.animationDuration = duration + 's';
          span.style.animationDelay = (Math.random() * 5) + 's';

          const size = 1.5 + Math.random() * 1.5;
          span.style.fontSize = size + 'rem';

          container.appendChild(span);
        }
      }, 2000);
    });
  </script>
</body>
</html>
