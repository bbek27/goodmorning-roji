<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Morning Roji!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
      max-width: 400px;
      width: 100%;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      color: #ffb6c1;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    span {
      font-weight: bold;
      color: #ffe4e1;
    }

    /* Big Music Button */
    .play-btn {
      background: #ffb6c1;
      color: #2c5364;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
      transition: all 0.3s ease;
    }

    .play-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Good Morning Roji! 🌸</h1>
    <p>
      Have a good day ahead. <br>
      <span>Be strong, take care, pretty girl!</span> ✨
    </p>
  </div>

  <!-- Music Player Button -->
  <button class="play-btn" id="musicBtn" onclick="playAudio()">▶️ Play Music 🎵</button>

  <!-- Audio source set to your uploaded file -->
  <audio id="myAudio" src="22b070edf7e4937e5d7ba203fb494249.mp3" preload="auto"></audio>

  <script>
    function playAudio() {
      var audio = document.getElementById("myAudio");
      var btn = document.getElementById("musicBtn");
      
      if (audio.paused) {
        audio.play();
        btn.innerHTML = "⏸️ Pause Music";
        btn.style.background = "#ffe4e1";
      } else {
        audio.pause();
        btn.innerHTML = "▶️ Play Music 🎵";
        btn.style.background = "#ffb6c1";
      }
    }
  </script>

</body>
</html>
