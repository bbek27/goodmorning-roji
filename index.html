<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Morning Roji!</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
      max-width: 400px;
      width: 100%;
      animation: fadeIn 1.5s ease-in-out;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      color: #ffb6c1;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    span {
      font-weight: bold;
      color: #ffe4e1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Good Morning Roji! 🌸</h1>
    <p>
      Have a good day ahead. <br>
      <span>Be strong, take care, pretty girl!</span> ✨
    </p>
  </div>

  <!-- Background Audio File -->
  <audio id="bg-music" src="22b070edf7e4937e5d7ba203fb494249.mp3" loop></audio>

  <!-- Play/Pause Music Button -->
  <button onclick="toggleMusic()" id="music-btn" style="position: fixed; bottom: 20px; right: 20px; padding: 10px 15px; border-radius: 20px; border: none; background: #ffb6c1; color: #2c5364; font-weight: bold; cursor: pointer; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">🎵 Play Song</button>

  <script>
    const music = document.getElementById('bg-music');
    const btn = document.getElementById('music-btn');

    function toggleMusic() {
      if (music.paused) {
        music.play();
        btn.innerText = "⏸️ Pause Song";
      } else {
        music.pause();
        btn.innerText = "🎵 Play Song";
      }
    }
  </script>

</body>
</html>
